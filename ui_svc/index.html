<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #2563eb;
            text-align: center;
            margin-top: 30px;
        }
        #uploadForm, #showAllInvoicesBtn {
            display: block;
            margin: 30px auto 10px auto;
            max-width: 400px;
            background: #fff;
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        #showAllInvoicesBtn {
            background: #2563eb;
            color: #fff;
            border: none;
            font-size: 1.1em;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        #showAllInvoicesBtn:hover {
            background: #1e40af;
        }
        .results-table, .invoice-table, .details-table, .all-invoices-table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .results-table th, .results-table td,
        .invoice-table th, .invoice-table td,
        .details-table th, .details-table td,
        .all-invoices-table th, .all-invoices-table td {
            border: 1px solid #e5e7eb;
            padding: 10px 14px;
            text-align: left;
        }
        .results-table th, .invoice-table th, .all-invoices-table th {
            background: #f1f5f9;
        }
        .details-table th {
            background: #e0e7ff;
        }
        .invoice-header {
            background: #dbeafe;
            font-weight: bold;
        }
        .invoice-id-link {
            color: #2563eb;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
        }
        #invoiceModal {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 1px solid #2563eb;
            padding: 32px 24px 24px 24px;
            z-index: 1000;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(37,99,235,0.12);
            border-radius: 16px;
        }
        #closeModalBtn {
            cursor: pointer;
            float: right;
            font-size: 24px;
            color: #2563eb;
            font-weight: bold;
            margin-top: -12px;
            margin-right: -12px;
        }
        #uploadResult {
            text-align: center;
            margin-top: 10px;
            color: #1e293b;
        }
        #allInvoicesTable {
            max-width: 900px;
            margin: 0 auto;
        }
        @media (max-width: 700px) {
            #invoiceModal {
                max-width: 95vw;
                padding: 12px 6px 6px 6px;
            }
            .results-table, .invoice-table, .details-table, .all-invoices-table {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <h1>Welcome to Your Basic HTML Page</h1>
    <p>This is a simple HTML file.</p>
    <button id="showAllInvoicesBtn">Show All Invoices</button>
    <div id="allInvoicesTable"></div>
    <div id="invoiceModal" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); background:#fff; border:1px solid #333; padding:20px; z-index:1000; max-width:600px;">
        <span id="closeModalBtn" style="cursor:pointer; float:right; font-size:20px;">&times;</span>
        <div id="modalContent"></div>
    </div>
    <form id="uploadForm" enctype="multipart/form-data">
        <label for="imageInput">Upload images:</label>
        <input type="file" id="imageInput" name="images" accept="image/*" multiple required>
        <button type="submit">Upload</button>
    </form>
    <div id="uploadResult"></div>
    <div id="invoiceTable"></div>
    <script>

// Show all invoices logic
document.getElementById('showAllInvoicesBtn').addEventListener('click', async function() {
    const tableDiv = document.getElementById('allInvoicesTable');
    tableDiv.innerHTML = 'Loading...';
    try {
        const response = await fetch('http://localhost:8081/invoice');
        const data = await response.json();
        if (response.ok && data.invoice && Array.isArray(data.invoice)) {
            tableDiv.innerHTML = renderAllInvoicesTable(data.invoice);
        } else {
            tableDiv.innerHTML = 'No invoices found.';
        }
    } catch (err) {
        tableDiv.innerHTML = 'Error: ' + err;
    }
});

function renderAllInvoicesTable(invoices) {
    let html = `<style>
        .all-invoices-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        .all-invoices-table th, .all-invoices-table td { border: 1px solid #ccc; padding: 8px; }
        .all-invoices-table th { background: #f2f2f2; }
        .invoice-id-link { color: #2563eb; cursor: pointer; text-decoration: underline; }
    </style>`;
    html += '<table class="all-invoices-table">';
    html += '<thead><tr>' +
        '<th>Invoice ID</th><th>Date</th><th>Provider</th>' +
        '</tr></thead><tbody>';
    invoices.forEach(inv => {
        html += '<tr>' +
            `<td><span class="invoice-id-link" onclick="showInvoiceModal('${inv._id.replace(/'/g, "")}', ${encodeURIComponent(JSON.stringify(inv))})">${inv._id}</span></td>` +
            `<td>${inv.bill_info ? inv.bill_info.invoice_date : ''}</td>` +
            `<td>${inv.provider ? inv.provider.name : ''}</td>` +
        '</tr>';
    });
    html += '</tbody></table>';
    // Attach modal logic
    setTimeout(() => { attachInvoiceModalHandlers(invoices); }, 0);
    return html;
}

function attachInvoiceModalHandlers(invoices) {
    document.querySelectorAll('.invoice-id-link').forEach((el, idx) => {
        el.onclick = function() {
            showInvoiceModal(invoices[idx]);
        };
    });
}

function showInvoiceModal(invoice) {
    const modal = document.getElementById('invoiceModal');
    const contentDiv = document.getElementById('modalContent');
    contentDiv.innerHTML = renderInvoiceTable([invoice]);
    modal.style.display = 'block';
}
document.getElementById('closeModalBtn').onclick = function() {
    document.getElementById('invoiceModal').style.display = 'none';
};

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData();
        const files = document.getElementById('imageInput').files;
        for (let i = 0; i < files.length; i++) {
            formData.append('images', files[i]);
        }
        const resultDiv = document.getElementById('uploadResult');
        resultDiv.textContent = 'Uploading...';
        document.getElementById('invoiceTable').innerHTML = '';
        try {
            // Upload images
            const uploadResponse = await fetch('http://localhost:8081/multi-image', {
                method: 'POST',
                body: formData
            });
            const uploadData = await uploadResponse.json();
            if (uploadResponse.ok && uploadData.files && uploadData.token) {
                resultDiv.textContent = 'Upload results:';
                document.getElementById('invoiceTable').innerHTML = renderResultsTable(uploadData.files);
                // Now fetch invoice details using the returned token
                resultDiv.textContent += ' Fetching invoice details...';
                const invoiceResponse = await fetch('http://localhost:8081/invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: uploadData.token })
                });
                const invoiceData = await invoiceResponse.json();
                if (invoiceResponse.ok && invoiceData.invoice) {
                    resultDiv.textContent += ' Done.';
                    // If invoiceData.invoice is an array, render all
                    if (Array.isArray(invoiceData.invoice)) {
                        document.getElementById('invoiceTable').innerHTML += renderInvoiceTable(invoiceData.invoice);
                    } else {
                        document.getElementById('invoiceTable').innerHTML += renderInvoiceTable([invoiceData.invoice]);
                    }
                } else {
                    resultDiv.textContent += ' Error fetching invoice details.';
                }
            } else {
                resultDiv.textContent = 'Error: ' + (uploadData.error || 'Unknown error');
            }
        } catch (err) {
            resultDiv.textContent = 'Error: ' + err;
        }
    });

    function renderResultsTable(results) {
        let html = `<style>
            .results-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
            .results-table th, .results-table td { border: 1px solid #ccc; padding: 8px; }
            .results-table th { background: #f2f2f2; }
        </style>`;
        html += '<table class="results-table">';
        html += '<thead><tr>' +
            '<th>Filename</th><th>Result/Error</th>' +
            '</tr></thead><tbody>';
        results.forEach(r => {
            html += '<tr>' +
                `<td>${r.filename}</td>` +
                `<td>${r.result ? r.result : (r.error + (r.details ? ': ' + r.details : ''))}</td>` +
            '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function renderInvoiceTable(invoices) {
        let html = `<style>
            .invoice-table, .details-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
            .invoice-table th, .invoice-table td, .details-table th, .details-table td { border: 1px solid #ccc; padding: 8px; }
            .invoice-table th { background: #f2f2f2; }
            .details-table th { background: #e9e9e9; }
            .invoice-header { background: #e0e7ff; font-weight: bold; }
        </style>`;
        html += '<table class="invoice-table">';
        html += '<thead><tr class="invoice-header">' +
            '<th>Invoice Date</th><th>Invoice Number</th><th>Invoice Series</th>' +
            '<th>Customer</th><th>Provider</th>' +
            '<th>Totals</th>' +
            '<th>Details</th>' +
            '</tr></thead><tbody>';
        invoices.forEach(inv => {
            html += '<tr>' +
                `<td>${inv.bill_info.invoice_date}</td>` +
                `<td>${inv.bill_info.invoice_number}</td>` +
                `<td>${inv.bill_info.invoice_series}</td>` +
                `<td><b>${inv.customer.name}</b><br>${inv.customer.address}</td>` +
                `<td><b>${inv.provider.name}</b><br>${inv.provider.address}</td>` +
                `<td>
                    <b>VAT:</b> ${inv.totals.total_vat}<br>
                    <b>With VAT:</b> ${inv.totals.total_with_vat}<br>
                    <b>Without VAT:</b> ${inv.totals.total_without_vat}
                </td>` +
                `<td>${renderDetailsTable(inv.invoice_details)}</td>` +
            '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function renderDetailsTable(details) {
        let html = '<table class="details-table">';
        html += '<thead><tr>' +
            '<th>Product</th><th>Quantity</th><th>Unit</th><th>Unit Price</th>' +
            '<th>Value Without VAT</th><th>VAT Rate</th><th>VAT Value</th>' +
            '</tr></thead><tbody>';
        details.forEach(d => {
            html += '<tr>' +
                `<td>${d.product}</td>` +
                `<td>${d.quantity}</td>` +
                `<td>${d.unit}</td>` +
                `<td>${d.unit_price}</td>` +
                `<td>${d.value_without_vat}</td>` +
                `<td>${d.vat_rate}</td>` +
                `<td>${d.vat_value}</td>` +
            '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }
    </script>
</body>
</html>
