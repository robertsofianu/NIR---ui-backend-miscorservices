<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Welcome to Your Basic HTML Page</h1>
    <p>This is a simple HTML file.</p>
    <form id="uploadForm" enctype="multipart/form-data">
        <label for="imageInput">Upload images:</label>
        <input type="file" id="imageInput" name="images" accept="image/*" multiple required>
        <button type="submit">Upload</button>
    </form>
    <div id="uploadResult"></div>
    <div id="invoiceTable"></div>
    <script>

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData();
        const files = document.getElementById('imageInput').files;
        for (let i = 0; i < files.length; i++) {
            formData.append('images', files[i]);
        }
        const resultDiv = document.getElementById('uploadResult');
        resultDiv.textContent = 'Uploading...';
        document.getElementById('invoiceTable').innerHTML = '';
        try {
            // Upload images
            const uploadResponse = await fetch('http://localhost:8081/multi-image', {
                method: 'POST',
                body: formData
            });
            const uploadData = await uploadResponse.json();
            if (uploadResponse.ok && uploadData.files && uploadData.token) {
                resultDiv.textContent = 'Upload results:';
                document.getElementById('invoiceTable').innerHTML = renderResultsTable(uploadData.files);
                // Now fetch invoice details using the returned token
                resultDiv.textContent += ' Fetching invoice details...';
                const invoiceResponse = await fetch('http://localhost:8081/invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: uploadData.token })
                });
                const invoiceData = await invoiceResponse.json();
                if (invoiceResponse.ok && invoiceData.invoice) {
                    resultDiv.textContent += ' Done.';
                    // If invoiceData.invoice is an array, render all
                    if (Array.isArray(invoiceData.invoice)) {
                        document.getElementById('invoiceTable').innerHTML += renderInvoiceTable(invoiceData.invoice);
                    } else {
                        document.getElementById('invoiceTable').innerHTML += renderInvoiceTable([invoiceData.invoice]);
                    }
                } else {
                    resultDiv.textContent += ' Error fetching invoice details.';
                }
            } else {
                resultDiv.textContent = 'Error: ' + (uploadData.error || 'Unknown error');
            }
        } catch (err) {
            resultDiv.textContent = 'Error: ' + err;
        }
    });

    function renderResultsTable(results) {
        let html = `<style>
            .results-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
            .results-table th, .results-table td { border: 1px solid #ccc; padding: 8px; }
            .results-table th { background: #f2f2f2; }
        </style>`;
        html += '<table class="results-table">';
        html += '<thead><tr>' +
            '<th>Filename</th><th>Result/Error</th>' +
            '</tr></thead><tbody>';
        results.forEach(r => {
            html += '<tr>' +
                `<td>${r.filename}</td>` +
                `<td>${r.result ? r.result : (r.error + (r.details ? ': ' + r.details : ''))}</td>` +
            '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function renderInvoiceTable(invoices) {
        let html = `<style>
            .invoice-table, .details-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
            .invoice-table th, .invoice-table td, .details-table th, .details-table td { border: 1px solid #ccc; padding: 8px; }
            .invoice-table th { background: #f2f2f2; }
            .details-table th { background: #e9e9e9; }
            .invoice-header { background: #e0e7ff; font-weight: bold; }
        </style>`;
        html += '<table class="invoice-table">';
        html += '<thead><tr class="invoice-header">' +
            '<th>Invoice Date</th><th>Invoice Number</th><th>Invoice Series</th>' +
            '<th>Customer</th><th>Provider</th>' +
            '<th>Totals</th>' +
            '<th>Details</th>' +
            '</tr></thead><tbody>';
        invoices.forEach(inv => {
            html += '<tr>' +
                `<td>${inv.bill_info.invoice_date}</td>` +
                `<td>${inv.bill_info.invoice_number}</td>` +
                `<td>${inv.bill_info.invoice_series}</td>` +
                `<td><b>${inv.customer.name}</b><br>${inv.customer.address}</td>` +
                `<td><b>${inv.provider.name}</b><br>${inv.provider.address}</td>` +
                `<td>
                    <b>VAT:</b> ${inv.totals.total_vat}<br>
                    <b>With VAT:</b> ${inv.totals.total_with_vat}<br>
                    <b>Without VAT:</b> ${inv.totals.total_without_vat}
                </td>` +
                `<td>${renderDetailsTable(inv.invoice_details)}</td>` +
            '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function renderDetailsTable(details) {
        let html = '<table class="details-table">';
        html += '<thead><tr>' +
            '<th>Product</th><th>Quantity</th><th>Unit</th><th>Unit Price</th>' +
            '<th>Value Without VAT</th><th>VAT Rate</th><th>VAT Value</th>' +
            '</tr></thead><tbody>';
        details.forEach(d => {
            html += '<tr>' +
                `<td>${d.product}</td>` +
                `<td>${d.quantity}</td>` +
                `<td>${d.unit}</td>` +
                `<td>${d.unit_price}</td>` +
                `<td>${d.value_without_vat}</td>` +
                `<td>${d.vat_rate}</td>` +
                `<td>${d.vat_value}</td>` +
            '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }
    </script>
</body>
</html>
